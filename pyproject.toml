[project]
name = "cli-data-validator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luizhenrique0897" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic[email]>=2.13.4",
    "pyyaml",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
cli-data-validator = "cli_data_validator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]
